<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6);
            font-family: "Trebuchet MS", sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 45px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 105, 150, 0.25);
            width: 330px;
            position: relative;
            z-index: 2;
        }

        .heart {
            font-size: 70px;
            animation: heartbeat 1.2s infinite;
        }

        h1 {
            color: #ff4f81;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        button {
            border: none;
            padding: 13px 25px;
            margin: 10px;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        #yes {
            background: #ff5c8a;
            color: white;
        }

        #yes:hover {
            transform: scale(1.12);
            background: #ff3972;
        }

        #no {
            background: #eee;
            color: #555;
            position: relative;
        }

        #message {
            display: none;
            margin-top: 20px;
            color: #ff4f81;
            font-size: 20px;
            font-weight: bold;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .floating-heart {
            position: absolute;
            color: #ff7da5;
            font-size: 25px;
            animation: float 6s linear infinite;
            bottom: -50px;
        }

        @keyframes float {
            from {
                transform: translateY(0);
                opacity: 1;
            }
            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h1>I have something important to ask you...</h1>

        <p>
            Do you love me?
        </p>

        <button id="yes" onclick="sayYes()">YES ❤️</button>
        <button id="no" onmouseover="runAway()">NO 😭</button>

        <div id="message">
            YAYYYYY!!! 💗💍🥹<br><br>
            I LOVE YOU FOREVER! ❤️
        </div>

    </div>

    <script>

        function sayYes() {
            document.getElementById("message").style.display = "block";

            for (let i = 0; i < 30; i++) {
                createHeart();
            }
        }

        function runAway() {
            const button = document.getElementById("no");

            const x = Math.random() * 250 - 125;
            const y = Math.random() * 200 - 100;

            button.style.transform =
                `translate(${x}px, ${y}px)`;
        }

        function createHeart() {
            const heart = document.createElement("div");

            heart.className = "floating-heart";
            heart.innerHTML = "❤️";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (Math.random() * 3 + 3) + "s";

            heart.style.fontSize =
                (Math.random() * 20 + 15) + "px";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        // Create some hearts automatically
        setInterval(createHeart, 700);

    </script>

</body>
</html>
